<div
  class="min-h-screen w-full flex items-center justify-start p-6 pr-10 md:p-12 md:pr-24 lg:p-16 lg:pr-36 bg-cover bg-left bg-no-repeat relative"
  dir="rtl"
  style="background-image: url('assets/images/vamino-login-bg.png')"
>
  <div class="absolute inset-0 bg-black/20"></div>

  <div
    class="relative z-10 w-full max-w-lg bg-white/95 backdrop-blur-sm rounded-3xl shadow-2xl px-9 pt-6 pb-12 md:px-10 md:pt-8 md:pb-14 border border-white/50"
  >
    <div class="flex justify-center mb-4">
      <img
        src="assets/images/vamino-png.png"
        alt="لوگوی وامینو"
        class="h-28 md:h-32 w-auto object-contain"
      />
    </div>

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-800 mb-3">
        ورود به حساب کاربری
      </h1>
      <p class="text-base text-slate-500">
        لطفاً برای ورود به حساب کاربری خود مشخصات را وارد کنید.
      </p>
    </div>

    <app-login-form
      (formSubmit)="onLoginSubmit($event)"
    />

    <div class="mt-8 cursor-pointer text-center text-base text-slate-500">
      حساب کاربری ندارید؟
      <a
        routerLink="/auth/register"
        class="text-indigo-600 font-medium hover:text-indigo-700 hover:underline"
      >
        ثبت‌نام کنید
      </a>
    </div>
  </div>
</div>
