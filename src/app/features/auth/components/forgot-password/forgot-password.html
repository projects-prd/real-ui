<form [formGroup]="form" (ngSubmit)="onSubmit()" dir="rtl" class="max-w-[420px] mx-auto flex flex-col gap-4 text-right">
  <div class="flex flex-col gap-1.5">
    <label for="email" class="font-medium text-sm text-slate-700">ایمیل</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      placeholder="name@company.com"
      class="w-full text-right bg-slate-50 border border-slate-300 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-100 rounded-xl px-3.5 py-2.5 text-slate-800 text-sm outline-none transition-all duration-200 placeholder:text-slate-400"
    />
    @if (isFieldInvalid(form, 'email')) {
      <small class="text-red-500 text-xs font-medium mt-0.5">{{ getFieldError(form, 'email') }}</small>
    }
  </div>

  <button
    type="submit"
    [disabled]="isSubmitting()"
    class="w-full cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-md shadow-indigo-200 active:scale-[0.99] transition-all text-sm flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed mt-1"
  >
    @if (isSubmitting()) {
      <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
    }
    <span>ارسال لینک بازیابی</span>
  </button>
</form>
