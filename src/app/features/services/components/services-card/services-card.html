<a [routerLink]="item.routerLink || []" class="service-card">
  <div class="icon-box">
    @if (item.isImage && !hasImageError) {
      <img
        [src]="item.icon || item.image"
        [alt]="item.title"
        class="card-img"
        referrerpolicy="no-referrer"
        (error)="onImageError()"
      />
    } @else {
      <i [class]="getFallbackIcon(item)"></i>
    }
  </div>
  <span class="card-title">{{ item.title }}</span>
</a>
